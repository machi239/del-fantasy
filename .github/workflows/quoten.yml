name: Quoten abrufen

on:
  schedule:
    - cron: "10 11 * * *"   # 13:10 Sommerzeit (vor Sonntags-Deadlines um 14:00)
    - cron: "20 16 * * *"   # 18:20 Sommerzeit (vor Deadlines um 19:30)
  workflow_dispatch:
    inputs:
      meta_neu:
        description: "Ligen, Märkte und Buchmacher neu laden"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daten-speichern
  cancel-in-progress: false

jobs:
  quoten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Quoten abrufen
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python scripts/odds.py ${{ inputs.meta_neu && '--meta-neu' || '' }} ${{ github.event_name == 'workflow_dispatch' && '--immer' || '' }}
      - name: Ergebnisse speichern
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Quoten $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
