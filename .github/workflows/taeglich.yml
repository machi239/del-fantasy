name: Täglicher Datenabzug

on:
  schedule:
    - cron: "0 9 * * *"   # täglich 09:00 UTC (11:00 Sommerzeit / 10:00 Winterzeit)
  workflow_dispatch:
    inputs:
      neu:
        description: "Alle Spiele neu auswerten"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Daten abrufen und auswerten
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scripts/update.py ${{ inputs.neu && '--neu' || '' }}
      - name: Ergebnisse speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Datenabzug $(date -u +'%Y-%m-%d')"
          git push
